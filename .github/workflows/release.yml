name: Release
on:
  - push
  - workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node --version
      - run: npm i
      - run: node --run test
      - run: node --run format
      - name: Build page
        if: github.ref == 'refs/heads/main'
        run: npm run page
      - name: commit auto fixes
        id: autofix
        env:
          USERNAME: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$(git diff --quiet && echo 0 || echo $?)" -gt 0 ]; then
            git config --global user.email "${USERNAME}@users.noreply.github.com"
            git config --global user.name "${USERNAME}"
            git commit -am "😎 Autofix"
            git push origin $BRANCH
            echo "autofixed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Build and Publish
        if: github.ref == 'refs/heads/main'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npx @lets/publish
      - name: Publish out to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
      - name: Create issue on failure
        if: failure() && steps.autofix.outputs.autofixed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="${WORKFLOW} workflow failed"
          BODY="Run: ${RUN_URL}"
          EXISTING="$(gh issue list --repo "${REPO}" --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number')"
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --repo "${REPO}" --body "${BODY}"
          else
            gh issue create --repo "${REPO}" --title "${TITLE}" --body "${BODY}" --assignee omrilotan
          fi
