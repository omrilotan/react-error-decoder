name: Periodic
on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node --version
      - run: npm i
      - run: node --run update
      - name: Push changes to main
        id: push
        env:
          USERNAME: ${{ github.actor }}
        run: |
          if git diff --quiet; then
            echo "Collection is up to date. Nothing to push."
            exit 0
          fi
          MESSAGE="$(sed -n '5p' CHANGELOG.md | sed 's/^- //')"
          git config user.email "${USERNAME}@users.noreply.github.com"
          git config user.name "${USERNAME}"
          git commit -am "${MESSAGE}"
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger release
        # Pushes made with GITHUB_TOKEN do not fire "on: push" workflows, so dispatch Release explicitly
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="${WORKFLOW} workflow failed"
          BODY="Run: ${RUN_URL}"
          EXISTING="$(gh issue list --repo "${REPO}" --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number')"
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --repo "${REPO}" --body "${BODY}"
          else
            gh issue create --repo "${REPO}" --title "${TITLE}" --body "${BODY}" --assignee omrilotan
          fi
